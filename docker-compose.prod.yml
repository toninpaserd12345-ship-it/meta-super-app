version: "3.8"
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meta_super_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meta_super_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/toninpaserd12345-ship-it/meta-super-app/backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      META_WHATSAPP_CONFIG_ID: ${META_WHATSAPP_CONFIG_ID:-991544757321935}
    ports:
      - "8080:8080"
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_data:
