# ຊື່ຂອງລະບົບອັດຕະໂນມັດນີ້
name: Backend CI/CD

# ກຳນົດວ່າຈະໃຫ້ມັນເລີ່ມເຮັດວຽກຕອນໃດ
on:
  push:
    branches: [ "main", "master" ] # ເຮັດວຽກຕອນທີ່ມີການ Push ເຂົ້າເສັ້ນ main ຫຼື master
    paths:
      - 'backend/**' # ເຮັດວຽກສະເພາະຕອນທີ່ໂຄດໃນໂຟນເດີ backend ມີການປ່ຽນແປງ
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  # ----------------------------------------------------
  # 1. ຂັ້ນຕອນການກວດສອບ ແລະ ທົດສອບໂຄດ (CI)
  # ----------------------------------------------------
  test:
    name: Test and Build
    runs-on: ubuntu-latest # ໃຊ້ເຄື່ອງເຊີບເວີຈຳລອງເປັນ Ubuntu
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4 # ດຶງໂຄດທັງໝົດລົງມາໃນເຄື່ອງຈຳລອງ

    - name: Set up Go
      uses: actions/setup-go@v5 # ຕິດຕັ້ງພາສາ Go ເວີຊັນ 1.25
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum
        
    - name: Verify dependencies
      run: go mod verify # ກວດສອບຄວາມຖືກຕ້ອງຂອງ Package ຕ່າງໆ

    - name: Build
      run: go build -v ./cmd/api # ລອງ Build ເບິ່ງວ່າມີ Error ຫຼື ບໍ່

    - name: Run vet
      run: go vet ./... # ກວດຫາຈຸດບົກຜ່ອງທາງ Syntax

    - name: Run tests
      run: go test -v -race -cover ./... # ລັນ Unit Test ທັງໝົດ

  # ----------------------------------------------------
  # 2. ຂັ້ນຕອນການສ້າງ Docker Image (CD)
  # ----------------------------------------------------
  docker-build-push:
    name: Docker Build & Push
    needs: test # ຕ້ອງລໍຖ້າໃຫ້ຂັ້ນຕອນ 'test' ຜ່ານກ່ອນ
    runs-on: ubuntu-latest
    # ຈະ Build Docker ສະເພາະຕອນ Push ເຂົ້າ main (ຖ້າເປັນພຽງ Pull Request ຈະຂ້າມໄປ)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3 # ເຂົ້າສູ່ລະບົບ GitHub Packages (GHCR)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5 # ກຽມຊື່ ແລະ Tag ໃຫ້ Docker Image
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # ເລີ່ມ Build ແລະ Push ຂຶ້ນ GitHub
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------------------------------
  # 3. ຂັ້ນຕອນການເອົາລົງ DigitalOcean (Deploy)
  # ----------------------------------------------------
  deploy-to-digitalocean:
    name: Deploy to DigitalOcean Droplet
    needs: docker-build-push # ຕ້ອງລໍຖ້າໃຫ້ Docker Build ສຳເລັດກ່ອນ
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3 # ໃຊ້ Action ສຳລັບ SSH ເຂົ້າເຊີບເວີ
        with:
          host: ${{ secrets.DO_HOST }} # ດຶງຄ່າ IP ຈາກ Secrets
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # ໃຫ້ເຊີບເວີ Login ເຂົ້າ GHCR ອັດຕະໂນມັດ
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # ເຂົ້າໄປທີ່ໂຟນເດີໂປຣເຈັກ (ທີ່ເຮົາຫາກໍ Copy ໄຟລ໌ໄປໄວ້)
            cd meta-super-app

            # Keep the shared Embedded Signup configuration in sync. WABA and
            # phone IDs are captured per workspace and are never global.
            export META_WHATSAPP_CONFIG_ID=991544757321935
            
            # ດຶງ Image ໃໝ່
            docker pull ghcr.io/toninpaserd12345-ship-it/meta-super-app/backend:latest
            
            # ແກ້ບັນຫາ Bug ຂອງ docker-compose ເກົ່າ (ContainerConfig error) ໂດຍການລຶບສະເພາະ api ອອກກ່ອນແລ້ວສ້າງໃໝ່
            docker-compose -p meta-super-app -f docker-compose.prod.yml stop api
            docker-compose -p meta-super-app -f docker-compose.prod.yml rm -f api
            docker-compose -p meta-super-app -f docker-compose.prod.yml up -d

            # Do not report a successful deployment until the API is actually
            # serving traffic. Print the container logs when startup fails so
            # migration/configuration errors are visible in the workflow.
            healthy=0
            for attempt in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" -ne 1 ]; then
              docker-compose -p meta-super-app -f docker-compose.prod.yml logs --tail=120 api
              exit 1
            fi
            
